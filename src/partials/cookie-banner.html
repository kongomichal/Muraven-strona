    <div class="cookie-content">
      <div class="cookie-icon-wrap">
        <i class="fa-solid fa-cookie-bite"></i>
      </div>
      <div class="cookie-text">
        <strong>Dbamy o Twoją prywatność</strong>
        <p>
          Nasza strona wykorzystuje pliki cookies i pamięć lokalną w celu zapewnienia prawidłowego działania serwisu, bezpieczeństwa oraz optymalizacji wygody przeglądania. Wybierz, na które pliki cookies wyrażasz zgodę.
        </p>
      </div>
    </div>
    <div class="cookie-actions">

      <button type="button" class="btn-cookie-accept" id="cookie-btn-accept">

    </div>
  </div>
</div>
